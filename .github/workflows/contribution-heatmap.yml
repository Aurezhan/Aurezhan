name: Update contribution heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update heatmap
        run: python scripts/generate_heatmap.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-heatmap.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(profile): cập nhật contribution heatmap"
          git push
