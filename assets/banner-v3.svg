<svg width="1400" height="480" viewBox="0 0 1400 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0d0914"/>
    <stop offset="28%" stop-color="#2c1024"/>
    <stop offset="58%" stop-color="#6e1d35"/>
    <stop offset="82%" stop-color="#b63445"/>
    <stop offset="100%" stop-color="#db584f"/>
  </linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#76203a"/>
    <stop offset="38%" stop-color="#42152b"/>
    <stop offset="100%" stop-color="#090b11"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0%" stop-color="#ff665f" stop-opacity="0.85"/>
    <stop offset="45%" stop-color="#ff4657" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#ff3049" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
</defs>

<rect width="1400" height="480" rx="14" fill="url(#sky)"/>

<!-- star haze -->
<g fill="#ff8c87" opacity=".32">
  <rect x="170" y="48" width="3" height="3"/><rect x="228" y="67" width="2" height="2"/>
  <rect x="382" y="39" width="3" height="3"/><rect x="654" y="53" width="2" height="2"/>
  <rect x="802" y="32" width="3" height="3"/><rect x="1072" y="64" width="2" height="2"/>
  <rect x="1188" y="42" width="3" height="3"/>
</g>

