  <path d="M135 120h110v8H135z"/><path d="M462 108h136v7H462z"/>
  <path d="M935 120h130v7H935z"/>
</g>

<!-- sun -->
<circle cx="1025" cy="220" r="118" fill="url(#sunGlow)" filter="url(#blur)"/>
<circle cx="1025" cy="220" r="73" fill="#ff4d5a"/>

