  <!-- midground forest -->
  <g fill="#171526" opacity="0.96">
    <path d="M0 245 C110 226 215 235 320 248 C430 262 520 235 630 242 C740 248 835 265 955 245 C1060 228 1130 232 1200 240 L1200 360 L0 360 Z"/>
  </g>

  <!-- lake -->
  <path d="M0 255 C120 245 230 267 345 258 C470 248 590 264 710 255 C835 245 958 262 1200 248 L1200 360 L0 360 Z" fill="url(#water)"/>

  <!-- water reflections -->
  <g stroke-linecap="square">
    <path d="M730 270 H1015" stroke="#ef795e" stroke-width="5" opacity="0.75"/>
    <path d="M780 283 H970" stroke="#e96d5b" stroke-width="4" opacity="0.62"/>
    <path d="M820 295 H935" stroke="#d75b56" stroke-width="3" opacity="0.5"/>
    <path d="M120 286 H315" stroke="#7a334d" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- islands -->
  <path d="M705 302 C750 280 805 284 845 303 C808 310 748 312 705 302 Z" fill="#151522"/>
  <g fill="#10131d">
    <path d="M742 300 L752 268 L762 300 H755 L768 309 H735 L748 300 Z"/>
    <path d="M790 300 L800 264 L810 300 H803 L816 309 H783 L796 300 Z"/>
    <path d="M824 301 L833 274 L842 301 H836 L846 308 H819 L829 301 Z"/>
  </g>

  <!-- foreground terrain -->
  <path d="M0 314 C110 294 205 326 315 314 C430 301 535 333 648 315 C770 296 870 326 985 310 C1070 298 1138 301 1200 306 L1200 360 L0 360 Z" fill="#0a0c12"/>

  <!-- dense pine silhouettes left -->
  <g fill="#0b0e16">
    <path d="M45 312 L86 178 L127 312 H105 L137 342 H35 L67 312 Z"/>
    <path d="M122 318 L157 205 L192 318 H172 L201 344 H113 L142 318 Z"/>
    <path d="M208 315 L239 220 L270 315 H253 L277 338 H201 L225 315 Z"/>
  </g>

  <!-- dense pine silhouettes right -->
  <g fill="#0b0e16">
    <path d="M1000 314 L1042 172 L1084 314 H1060 L1092 342 H990 L1022 314 Z"/>
    <path d="M1080 319 L1114 210 L1148 319 H1129 L1157 344 H1071 L1099 319 Z"/>
    <path d="M1140 315 L1168 228 L1196 315 H1181 L1200 335 H1136 L1155 315 Z"/>
  </g>

  <!-- deer silhouette -->
  <g fill="#0b0d13">
    <ellipse cx="555" cy="304" rx="22" ry="12"/>
    <rect x="539" y="305" width="7" height="30"/>
    <rect x="563" y="305" width="7" height="30"/>
    <path d="M572 294 L587 276 L598 279 L590 288 L598 294 Z"/>
    <circle cx="591" cy="280" r="7"/>
    <path d="M589 274 L584 262 M589 274 L595 262 M584 262 L580 257 M595 262 L600 257" stroke="#0b0d13" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- subtle stars / particles -->
  <g fill="#ffd7b0" opacity="0.55">
    <rect x="255" y="64" width="3" height="3"/><rect x="515" y="56" width="3" height="3"/><rect x="620" y="72" width="3" height="3"/>
    <rect x="1040" y="86" width="3" height="3"/><rect x="1120" y="58" width="3" height="3"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="'Courier New', monospace" font-weight="700">
    <text x="600" y="126" font-size="50" fill="#fff4e8" letter-spacing="6">HELLO WORLD</text>
    <text x="600" y="191" font-size="45" fill="#ffb19b" letter-spacing="7">I'M HAN!</text>
  </g>

  <!-- bottom line -->
  <text x="600" y="338" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#c8b8c8" letter-spacing="4">GAME SYSTEMS • BACKEND • UNITY • C# • LUA</text>
</svg>