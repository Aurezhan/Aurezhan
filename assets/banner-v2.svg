    <path d="M370 100 L402 136 L380 129 L360 144 L340 136 Z"/>
    <path d="M670 128 L700 156 L678 150 L660 165 L643 156 Z"/>
    <path d="M980 112 L1012 146 L988 139 L968 154 L950 145 Z"/>
