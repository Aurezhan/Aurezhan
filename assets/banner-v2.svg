<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1734"/>
      <stop offset="38%" stop-color="#5f2742"/>
      <stop offset="72%" stop-color="#b44d4f"/>
      <stop offset="100%" stop-color="#ef7a57"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b2945"/>
      <stop offset="45%" stop-color="#46233a"/>
      <stop offset="100%" stop-color="#161522"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#ffe0a2" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffb36f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff8b63" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="14" fill="url(#sky)"/>

  <!-- pixel clouds -->
  <g opacity="0.55" fill="#d86863">
    <rect x="80" y="64" width="54" height="8"/><rect x="126" y="56" width="64" height="8"/><rect x="182" y="64" width="44" height="8"/>
    <rect x="310" y="78" width="42" height="7"/><rect x="348" y="70" width="70" height="7"/><rect x="412" y="78" width="48" height="7"/>
    <rect x="900" y="60" width="42" height="7"/><rect x="936" y="52" width="74" height="7"/><rect x="1004" y="60" width="50" height="7"/>
  </g>

  <!-- sun + glow -->
  <circle cx="870" cy="145" r="92" fill="url(#sunGlow)" filter="url(#softGlow)"/>
  <circle cx="870" cy="145" r="48" fill="#ffd18a"/>

  <!-- far mountain layers -->
  <path d="M0 215 L120 120 L225 205 L370 100 L525 220 L670 128 L810 220 L980 112 L1200 220 L1200 360 L0 360 Z" fill="#45223e"/>
  <path d="M0 238 L155 160 L275 225 L420 142 L575 232 L730 162 L900 232 L1055 152 L1200 228 L1200 360 L0 360 Z" fill="#321d36"/>

  <!-- snow / ridge details -->
  <g fill="#6a3551" opacity="0.8">
