<text x="0" y="44">Hello World,</text><text x="150" y="44">I</text><text x="158" y="44">'</text><text x="164" y="44">m</text><text x="193" y="44">H</text><text x="211" y="44">a</text><text x="226" y="44">n</text><text x="242" y="44">!</text>
